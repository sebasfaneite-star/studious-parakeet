<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ucker Sales HQ</title>
  <meta name="description" content="Ucker Sales HQ: pipeline, contacts and follow-ups for the sales team.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sales HQ">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <div>
        <h1>Ucker Sales HQ</h1>
        <p id="greeting" class="muted"></p>
      </div>
    </div>
    <button id="installBtn" class="btn small" hidden>Install app</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <button id="fab" class="fab" aria-label="Add new">+</button>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="dashboard" class="active"><span class="ico">◧</span><span>Home</span></button>
    <button data-tab="pipeline"><span class="ico">▤</span><span>Pipeline</span></button>
    <button data-tab="contacts"><span class="ico">☺</span><span>Contacts</span></button>
    <button data-tab="tasks"><span class="ico">✓</span><span>Tasks</span></button>
    <button data-tab="settings"><span class="ico">⚙</span><span>More</span></button>
  </nav>

  <dialog id="modal">
    <form id="modalForm" method="dialog"></form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
