<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="UCKER Sales HQ: leads, visits, clients, sales and goals for the UCKER sales team.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UCKER HQ">
<meta name="theme-color" content="#ffffff">
<title>UCKER Sales HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* UCKER website palette: white, ink black, soft pink, rose */
:root{
  --bg:#ffffff;--card:#ffffff;--card2:#fbeef3;--line:#ece4e8;--line2:#ddd3d8;--text:#111111;--mut:#6f646c;--dim:#8a7d84;
  --pink:#e79cb9;--pink2:#a8336a;--pinkbg:#fbeef3;--ink:#111111;
  --green:#1f7a52;--greenbg:#e5f3ec;--amber:#a15c00;--amberbg:#fdf1de;--red:#b4235a;--redbg:#fbe3ec;
  --r:14px;--fd:"Montserrat",Arial,sans-serif;--fb:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
a{color:var(--pink2)}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:28px;font-weight:900}
h2{font-size:17px;font-weight:800}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header::before{content:"";display:block;height:5px;background:linear-gradient(115deg,var(--ink) 0 72%,var(--pink) 72% 76%,var(--ink) 76% 100%)}
.bar{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.brand img{height:46px;width:auto;display:block}
.brand small{padding-left:12px;border-left:2px solid var(--pink);white-space:nowrap}
@media (max-width:440px){.brand small{display:none}}
.brand small{color:var(--ink);font:800 11px var(--fd);text-transform:uppercase;letter-spacing:.16em}
nav.tabs{display:flex;gap:4px;margin-left:auto;align-items:center}
nav.tabs a{color:var(--mut);text-decoration:none;font-weight:600;font-size:14px;padding:8px 13px;border-radius:999px}
nav.tabs a:hover{color:var(--ink);background:var(--card2)}
nav.tabs a.on{color:#fff;background:var(--ink)}
nav.tabs a.cta{background:var(--pink);color:var(--ink);margin-right:6px;font-weight:700}
nav.tabs a.cta.on,nav.tabs a.cta:hover{background:#dc86a7;color:var(--ink)}
.langbtn{font:700 13px var(--fb);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;letter-spacing:.06em}
.langbtn:hover{background:var(--card2)}
.goalsLink{display:none;margin-left:auto;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px;border:2px solid var(--line)}
#bottomnav{display:none}
@media (max-width:820px){
  nav.tabs{display:none}
  .goalsLink{display:inline-block}
  .langbtn{margin-left:8px}
  #bottomnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(17,17,17,.06);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);text-decoration:none;font-size:11px;font-weight:600;padding:4px 0}
  #bottomnav a .ic{font-size:18px;line-height:1}
  #bottomnav a.on{color:var(--pink2)}
  #bottomnav a.cta .ic{background:var(--pink);color:var(--ink);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:800}
  main{padding-bottom:90px!important}
}
main{padding:26px 0 50px}
#banner:empty{display:none}
.banner{margin:14px 0 0;padding:11px 14px;border-radius:12px;font-size:14px;border:1px solid var(--line);background:var(--card2)}
.banner.warn{border-color:#f0d3a6;background:var(--amberbg)}
.banner.err{border-color:#f0b9cd;background:var(--redbg)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{position:relative;padding-bottom:8px}
.pagehead h1::after{content:"";position:absolute;left:0;bottom:0;width:44px;height:4px;border-radius:2px;background:var(--pink)}
.pagehead p{margin:6px 0 0;color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.panel h2{margin-bottom:12px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel .ph h2{margin:0}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media (max-width:900px){.cards3{grid-template-columns:1fr}}
/* the three forecast cards use the website's black band with a pink stripe */
.pcard{--text:#fff;--mut:#cbbfc5;--dim:#a99ca3;--card2:#2a2629;--line:#2f2a2d;--green:#6fd3a2;--greenbg:rgba(111,211,162,.16);--amber:#ffc46b;--amberbg:rgba(255,196,107,.16);--red:#ff8fb3;--redbg:rgba(255,143,179,.16);--pink2:#f2b8cf;
  background:var(--ink);color:#fff;border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(115deg,var(--pink) 0 34%,transparent 34% 37%,var(--pink) 37% 40%,transparent 40%)}
.pcard h2,.pcard h3{color:#fff}
.pcard .k{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--pink);font-weight:700;font-family:var(--fd)}
.pcard .big{font-family:var(--fd);font-weight:900;font-size:34px;margin:6px 0 0;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:13px}
.prog{height:8px;border-radius:99px;background:var(--card2);margin:12px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pink);border-radius:99px}
.prog.g i{background:var(--green)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exp{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.exp b{font-family:var(--fd);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#f3eef0;color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--greenbg);color:var(--green)}
.chip.bad{background:var(--redbg);color:var(--red)}
.chip.warn{background:var(--amberbg);color:var(--amber)}
.chip.pink{background:var(--pinkbg);color:var(--pink2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols>.panel{margin-bottom:16px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.stats{display:grid;gap:0}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .l{color:var(--mut);font-size:14px}
.stat .l small{display:block;color:var(--dim);font-size:12px}
.stat .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.stat .v.hi{color:var(--pink2);font-family:var(--fd);font-weight:800;font-size:18px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.mini>div{background:var(--card2);border-radius:12px;padding:12px 14px}
.mini b{display:block;font-family:var(--fd);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.mini span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:700;text-align:left;padding:8px 8px;border-bottom:2px solid var(--ink)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fdf7f9}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:var(--pink);box-shadow:0 4px 16px rgba(168,51,106,.07)}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h3{font-size:16px;font-weight:800}
.item .meta{color:var(--mut);font-size:13px;margin-top:2px}
.item .money{font-family:var(--fd);font-weight:800;font-size:18px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .notes{margin-top:8px;color:#4a4045;font-size:14px;white-space:pre-wrap}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters input[type=search]{flex:1;min-width:180px}
input,select,textarea{font:inherit;color:var(--text);background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--pink2);padding:0}
input:disabled,select:disabled{opacity:.6;background:#faf7f8}
.filters select{width:auto}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#4a4045}
label.check{flex-direction:row;align-items:center;gap:10px;color:var(--text);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .full{grid-column:1/-1}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--mut);font-weight:500}
.hint.bad{color:var(--amber)}
/* pill buttons like the website: pink = main action, black = strong, white with border = normal */
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:999px;padding:9px 18px;border:2px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--pink);border-color:var(--pink);color:var(--ink);font-weight:700}
.btn.p:hover{background:#dc86a7;border-color:#dc86a7;transform:translateY(-1px)}
.btn.k{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.g{background:var(--greenbg);border-color:#bfe3cf;color:var(--green)}
.btn.g:hover{border-color:var(--green)}
.btn.d{color:var(--red)}
.btn.d:hover{border-color:var(--red)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.formfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:28px 10px;font-size:14px}
.callout{border:1px solid #f2c9d9;background:var(--pinkbg);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gh{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}.gh:first-child{border-top:0;padding-top:0;margin-top:0}.gh h3{font-size:15px;font-weight:800;color:var(--text)}.gh .hint{display:block;margin-top:4px}
.paylink{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--card2);border-radius:12px;padding:12px;margin-bottom:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.tiers{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.tiers span{background:var(--card2);border-radius:99px;padding:3px 10px}.tiers b{color:var(--text)}
ol.route{margin:0 0 16px;padding-left:22px;display:grid;gap:10px}ol.route li{padding-left:4px}ol.route li>div{display:inline-block;width:calc(100% - 90px);vertical-align:top}ol.route li button{float:right}
a.btn{display:inline-flex;align-items:center}
.sel-inline{width:auto;padding:6px 10px;font-size:13px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(17,17,17,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:620px;padding:22px;box-shadow:0 20px 60px rgba(17,17,17,.25);border-top:6px solid var(--pink)}
.mbox h2{font-size:20px;margin-bottom:6px}
.mbox .msub{color:var(--mut);margin:0 0 16px;font-size:14px}
.total{font-family:var(--fd);font-weight:800;font-size:18px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:820px){#toast{bottom:92px}}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--pink2);font-weight:700;font-family:var(--fd);margin:22px 0 10px}
.muted{color:var(--mut)}
.nowrap{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#dashboard"><img src="logo-dark.png" alt="UCKER" width="130" height="46"><small id="brandSub">Sales HQ</small></a>
    <nav class="tabs" id="tabs"></nav>
    <a class="goalsLink" href="#goals" id="goalsLink">Goals</a>
    <button type="button" class="langbtn" id="langBtn" data-notr aria-label="Cambiar a español">ES</button>
  </div>
</header>
<div class="wrap"><div id="banner"></div></div>
<main class="wrap" id="main"></main>
<nav id="bottomnav"></nav>
<div id="modal" hidden></div>
<div id="toast"></div>

<script src="local-db.js"></script>
<script>
"use strict";
/* ---------- constants ---------- */
const ROUTES=['dashboard','log','leads','visits','clients','sales','goals'];
const LABELS={dashboard:'Dashboard',log:'+ Log visit',leads:'Leads',visits:'Visits',clients:'Clients',sales:'Sales',goals:'Goals'};
const TYPES=['Barbershop','Hair salon','Nail / lash salon','Tattoo studio','Restaurant / food truck','Cleaning service','Medical / dental','Auto shop','Nursery / farm','Other'];
const SIZES=['','S','M','L','XL','Mixed'];
const STATUS={quoted:'Quoted',followup:'Follow-up',won:'Won',lost:'Lost'};
const STATUS_CHIP={quoted:'pink',followup:'warn',won:'ok',lost:'bad'};
const FREQ={weekly:{label:'Weekly',perMonth:52/12},biweekly:{label:'Every 2 weeks',perMonth:26/12},monthly:{label:'Monthly',perMonth:1},bimonthly:{label:'Every 2 months',perMonth:.5}};
const DEFAULTS={monthlyRevenueGoal:0,monthlyCasesGoal:0,visitsPerRepPerDay:0,workDaysPerWeek:6,inventoryCases:0,stockS:0,stockM:0,stockL:0,stockXL:0,casesSoldBefore:0,sellByDate:'',pushStartDate:'',goalAvgPrice:0,floorPrice:0,listPrice:0,defaultCloseRatePct:20,taxRatePct:7,tierPrice1:0,payZelle:'',payCheckTo:'',payLink:'',payCash:'',payOther:'',paymentTermsDays:0,tierPrice2:0,tierPrice3:0,tierPrice4:0,companyName:'',companyAddress:'',companyPhone:'',companyEmail:'',companyWeb:'',paymentInstructions:''};

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const addMonths=(s,n)=>{const d=pd(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ds(d)};
const weekStart=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const monthStart=s=>s.slice(0,8)+'01';
const monthEnd=s=>{const d=pd(s);return ds(new Date(d.getFullYear(),d.getMonth()+1,0))};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const nextOrder=(s,f)=>f==='weekly'?addDays(s,7):f==='biweekly'?addDays(s,14):f==='bimonthly'?addMonths(s,2):addMonths(s,1);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const money=n=>{n=+n||0;return (n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US')};
const money2=n=>'$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const int=n=>Math.round(+n||0).toLocaleString('en-US');
const one=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:1});
const pct=n=>Math.round((+n||0)*100)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>validDate(s)?pd(s).toLocaleDateString(LOC(),{month:'short',day:'numeric'}):'—';
const fmtDateY=s=>validDate(s)?pd(s).toLocaleDateString(LOC(),{month:'short',day:'numeric',year:'numeric'}):'—';
const iso=()=>new Date().toISOString();
const lc=s=>String(s||'').trim().toLowerCase();
const $=(sel,root=document)=>root.querySelector(sel);

/* ---------- language (English / Español) ---------- */
let LANG='en';try{LANG=localStorage.getItem('ucker-sales-lang')==='es'?'es':'en'}catch(e){}
const LOC=()=>LANG==='es'?'es-US':'en-US';
const ES={
'Sales HQ':'Central de ventas','Dashboard':'Panel','+ Log visit':'+ Registrar visita','Visits':'Visitas','Clients':'Clientes','Sales':'Ventas','Goals':'Metas',
'Home':'Inicio','Log':'Registrar','+ Log a visit':'+ Registrar visita','Log a visit':'Registrar una visita',
'Today':'Hoy','This week':'Esta semana','This month':'Este mes','On track':'En camino','Expected revenue':'Ingreso esperado','Goal —':'Meta —',
'What it takes':'Lo que hace falta','Cases left to sell':'Cajas por vender','Days until sell-by date':'Días hasta la fecha límite',
'Cases needed per week':'Cajas necesarias por semana','Revenue needed per week':'Ingreso necesario por semana','Deals to close per week':'Ventas a cerrar por semana',
'Visits needed per week':'Visitas necesarias por semana','Visits needed per work day':'Visitas necesarias por día laboral','Team visits this week':'Visitas del equipo esta semana',
'Gross profit this month':'Ganancia bruta este mes','only you see this':'solo tú lo ves',
'Pipeline':'Oportunidades','open quotes':'cotizaciones abiertas','quoted value':'valor cotizado','close rate':'tasa de cierre','Follow-ups due':'Seguimientos pendientes',
'No follow-ups due in the next 2 days.':'No hay seguimientos en los próximos 2 días.',
'Money owed':'Dinero por cobrar','All sales':'Todas las ventas','collected to date':'cobrado a la fecha','Client':'Cliente','Order':'Pedido','Due':'Vence','Owed':'Por cobrar',
'Mark paid':'Marcar pagado','partly paid':'pago parcial','Nothing owed. Every invoice is paid.':'No te deben nada. Todas las facturas están pagadas.',
'Sales tax charged so far:':'Impuesto cobrado hasta ahora:',
'. That money goes to the Florida Department of Revenue, so it is left out of revenue and goals.':'. Ese dinero va al Departamento de Ingresos de Florida, así que no cuenta en los ingresos ni en las metas.',
'Recurring clients':'Clientes recurrentes','All clients':'Todos los clientes','recurring clients':'clientes recurrentes','expected per month':'esperado por mes','new this month':'nuevos este mes',
'No recurring clients yet. When you mark a visit as won, tick “Recurring client”.':'Aún no hay clientes recurrentes. Al marcar una visita como ganada, marca “Cliente recurrente”.',
'Bought 2+ times but not marked recurring:':'Compraron 2+ veces pero no están marcados como recurrentes:',

'Schedule':'Frecuencia','Per month':'Por mes','Next order':'Próximo pedido','New':'Nuevo',
'Team this month':'Equipo este mes','No visits logged this month yet.':'Aún no hay visitas registradas este mes.','Rep':'Vendedor','Visits this week':'Visitas esta semana',
'Visits (month)':'Visitas (mes)','Open quotes':'Cotizaciones abiertas','Won':'Ganadas','Cases':'Cajas','Revenue':'Ingresos',
'No sales goal set yet. Set the monthly target so the team can see what to hit.':'Aún no hay meta de ventas. Define la meta mensual para que el equipo sepa qué alcanzar.','Set goals':'Definir metas',

/* ---------- modal ---------- */
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function openModal({title,sub='',body,submit='Save',danger=false,onSubmit,onOpen}){
  const m=$('#modal');
  m.innerHTML=`<form class="mbox" novalidate><h2>${esc(title)}</h2>${sub?`<p class="msub">${sub}</p>`:''}${body}
    <div class="formfoot"><button type="button" class="btn" data-x>Cancel</button><button class="btn ${danger?'d':'p'}" type="submit">${esc(submit)}</button></div></form>`;
  m.hidden=false;const f=$('form',m);
  $('[data-x]',f).onclick=closeModal;
  m.onclick=e=>{if(e.target===m)closeModal()};
  f.onsubmit=async e=>{e.preventDefault();const btn=$('button[type=submit]',f);btn.disabled=true;
    try{const ok=await onSubmit(f);if(ok!==false)closeModal();else btn.disabled=false}catch(err){btn.disabled=false;writeErr(err)}};
  onOpen&&onOpen(f);const first=$('input:not([type=checkbox]),select',f);first&&first.focus&&setTimeout(()=>first.focus(),30)}
function confirmDelete(what,ref){openModal({title:`Delete ${what}?`,body:`<p class="muted" style="margin:0">This removes it from this phone and can't be undone.</p>`,submit:'Delete',danger:true,
  onSubmit:async()=>{await ref.delete();toast('Deleted')}})}

function visitFormHTML(v={}){const c=cfg();return `<div class="grid2">

function bindVisitForm(f){const h=$('[data-floor]',f);const up=()=>{const p=num(f.price.value),cs=num(f.cases.value),fl=num(cfg().floorPrice);
  let t='';if(p>0){t=`Quote value: <b>${money2(p*(cs||1))}</b>${cs?'':' (per case)'}`;
    if(fl&&p<fl){h.className='hint bad';h.innerHTML=t+`<br>Below the ${money2(fl)} floor — needs Sebastian's approval.`;return}}
  h.className='hint';h.innerHTML=t};
  f.price.addEventListener('input',up);f.cases.addEventListener('input',up);up();bindTierPrice(f)}
function readVisit(f){const g=n=>(f[n]&&f[n].value||'').trim();const cs=g('cases');return{
  place:g('place'),businessType:g('businessType'),date:validDate(g('date'))?g('date'):today(),address:g('address'),contact:g('contact'),phone:g('phone'),
  price:num(g('price')),cases:cs===''?null:num(cs),size:g('size'),status:STATUS[g('status')]?g('status'):'quoted',followUpDate:validDate(g('followUpDate'))?g('followUpDate'):'',notes:g('notes')}}
function validVisit(v){if(!v.place){toast('Add the place name');return false}if(!(v.price>0)){toast('Add the price you quoted per case');return false}return true}

/* ---------- order / won modal ---------- */
function freqSelect(cur){return `<select name="frequency">${Object.entries(FREQ).map(([k,f])=>opt(k,f.label,cur||'monthly')).join('')}</select>`}
function openOrderModal({mode,visit,client}){
  const t=today();const match=mode==='won'?findClientByName(visit.place):null;
  const cases=mode==='won'?(visit.cases||''):mode==='client'?(client.casesPerOrder||''):'';
  const price=mode==='won'?visit.price:mode==='client'?(client.pricePerCase||''):'';
  const size=mode==='won'?visit.size:mode==='client'?client.size:'';
  let body='<div class="grid2">';
  if(mode==='manual'){const cl=[...S.clients].sort((a,b)=>lc(a.name).localeCompare(lc(b.name)));
    body+=`<label class="full">Client<select name="clientId"><option value="">— New / one-time buyer —</option>${cl.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.recurring?' ★':''}</option>`).join('')}</select></label>
    <label class="full" data-newname>Buyer name *<input name="clientName" placeholder="Business name"></label>`}
  body+=`<label>Order date<input type="date" name="date" value="${t}"></label>
    <label>Glove size<select name="size">${SIZES.map(s=>opt(s,s||'—',size||'')).join('')}</select></label>
    <label>Cases sold *<input name="cases" type="number" min="0" step="1" inputmode="numeric" value="${esc(cases)}"></label>
    <label>Price per case *<input name="price" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(price)}"></label>
    `+mixHTML()+`<div class="full row"><span class="hint" data-floor></span><span class="total" data-total></span></div>`+taxFieldHTML(mode==='client'?client.taxable!==false:mode==='won'?!(match&&match.taxable===false):true)+payFieldsHTML();
  if(mode==='won'){
    body+=match?`<div class="full hint">Already in clients as <b>${esc(match.name)}</b> — this sale will be added to their history.</div>`
      :`<label class="check full"><input type="checkbox" name="addClient" checked> Add ${esc(visit.place)} to clients</label>`;
    body+=`<label class="check full"><input type="checkbox" name="recurring" ${match&&match.recurring?'checked':''}> Recurring client — they'll reorder on a schedule</label>
      <div class="full grid2" data-rec style="display:none"><label>How often<select name="frequency">${Object.entries(FREQ).map(([k,f])=>opt(k,f.label,(match&&match.frequency)||'monthly')).join('')}</select></label>
      <label>Next expected order<input type="date" name="nextOrderDate"></label></div>`}
  body+='</div>';
  const title=mode==='won'?`Mark as won: ${visit.place}`:mode==='client'?`Log order: ${client.name}`:'Add a sale';
  const sub=mode==='won'?'Records the sale. Cancel keeps the visit as it was.':mode==='client'&&client.recurring?`Recurring ${esc((FREQ[client.frequency]||{}).label||'')} — next order date moves forward automatically.`:'';
  openModal({title,sub,body,submit:'Save sale',
    onOpen:f=>{const tot=$('[data-total]',f),fl=$('[data-floor]',f);
      const up=()=>{const c=num(f.cases.value),p=num(f.price.value);
        const floor=num(cfg().floorPrice);fl.className='hint'+(floor&&p&&p<floor?' bad':'');fl.textContent=floor&&p&&p<floor?`Below ${money2(floor)} floor — needs approval`:''};
      f.cases.addEventListener('input',up);f.price.addEventListener('input',up);up();bindPayFields(f);bindTotals(f);bindMix(f);if(mode==='manual'){const fill=()=>{if(!f.clientId.value&&!f.price.value){const p=tierPrice(f.cases.value);if(p){f.price.value=p.toFixed(2);f.price.dispatchEvent(new Event('input'))}}};f.cases.addEventListener('change',fill)}
      if(mode==='manual'){const nn=$('[data-newname]',f);const sw=()=>{const c=S.clients.find(x=>x.id===f.clientId.value);nn.style.display=f.clientId.value?'none':'';
          if(c){if(!f.cases.value&&c.casesPerOrder)f.cases.value=c.casesPerOrder;if(!f.price.value&&c.pricePerCase)f.price.value=c.pricePerCase;up()}};
        f.clientId.addEventListener('change',()=>{const c=S.clients.find(x=>x.id===f.clientId.value);f.taxable.checked=!c||c.taxable!==false;f.taxable.dispatchEvent(new Event('change'))});
        f.clientId.addEventListener('change',sw);sw()}
      if(mode==='won'){const rs=$('[data-rec]',f);const sw=()=>{rs.style.display=f.recurring.checked?'':'none';
          if(f.recurring.checked&&!f.nextOrderDate.value)f.nextOrderDate.value=nextOrder(f.date.value||t,f.frequency.value)};
        f.recurring.addEventListener('change',sw);f.frequency.addEventListener('change',()=>{f.nextOrderDate.value=nextOrder(f.date.value||t,f.frequency.value)});sw()}},
    onSubmit:async f=>{if(!needWrite())return false;
      const d=validDate(f.date.value)?f.date.value:t,cs=num(f.cases.value),pr=num(f.price.value);
      if(!(cs>0)||!(pr>0)){toast('Enter cases and price per case');return false}
      let clientId=null,clientName='',cl=client||null,repId=S.uid||null;
      if(mode==='client'){clientId=client.id;clientName=client.name;repId=client.repId||repId}
      if(mode==='manual'){clientId=f.clientId.value||null;
        if(clientId){cl=S.clients.find(c=>c.id===clientId);clientName=cl?cl.name:'';repId=(cl&&cl.repId)||repId}
        else{clientName=f.clientName.value.trim();if(!clientName){toast('Add the buyer name');return false}}}
      if(mode==='won'){clientName=visit.place;repId=visit.repId||repId;
        const rec=f.recurring.checked,freq=f.frequency.value,nod=validDate(f.nextOrderDate.value)?f.nextOrderDate.value:nextOrder(d,freq);
        if(match){clientId=match.id;
          if(rec&&!match.recurring)await S.db.doc('clients/'+match.id).update({recurring:true,frequency:freq,nextOrderDate:nod,recurringSince:d,casesPerOrder:num(match.casesPerOrder)||cs,pricePerCase:num(match.pricePerCase)||pr});
          else if(match.recurring&&(!validDate(match.nextOrderDate)||match.nextOrderDate<=d))await S.db.doc('clients/'+match.id).update({nextOrderDate:nextOrder(d,match.frequency)})}
        else if(f.addClient.checked||rec){
          const ref=await S.db.collection('clients').add({name:visit.place,businessType:visit.businessType||'',contact:visit.contact||'',phone:visit.phone||'',address:visit.address||'',
            recurring:rec,frequency:freq,casesPerOrder:cs,pricePerCase:pr,size:f.size.value,taxable:f.taxable.checked,nextOrderDate:rec?nod:'',recurringSince:rec?d:'',notes:'',repId,createdAt:iso(),firstOrderDate:d});
          clientId=ref.id}}
      const a=amounts(cs,pr,f.taxable.checked);
      
      const rp=splitPay(readPay(f,a.invoiceTotal));const saleRef=await S.db.collection('sales').add({clientId,clientName,date:d,cases:cs,pricePerCase:pr,sizes:readSizes(f),countsAgainstStock:true,...a,...rp.rest,size:f.size.value,repId,visitId:visit?visit.id:null,loggedBy:S.uid||null,createdAt:iso()});await savePay(saleRef.id,rp.pay);
      if(mode==='won'){await S.db.doc('visits/'+visit.id).update({status:'won',clientId,wonDate:d});if(visit.leadId)await S.db.doc('leads/'+visit.leadId).update({status:'won',clientId}).catch(()=>{})}
      if(mode!=='won'&&cl&&cl.recurring&&FREQ[cl.frequency]&&(!validDate(cl.nextOrderDate)||cl.nextOrderDate<=d))
        await S.db.doc('clients/'+cl.id).update({nextOrderDate:nextOrder(d,cl.frequency)});
      toast(`Sale saved: ${money2(a.invoiceTotal)}`)}})}

function openClientModal(c){const isNew=!c;c=c||{};
  const body=`<div class="grid2">
    <label class="full">Business name *<input name="name" value="${esc(c.name)}"></label>
    <label>Business type<select name="businessType">${TYPES.map(t=>opt(t,t,c.businessType||TYPES[0])).join('')}</select></label>
    <label>Contact person<input name="contact" value="${esc(c.contact)}"></label>
    <label>Phone<input name="phone" type="tel" value="${esc(c.phone)}"></label>
    <label>Usual glove size<select name="size">${SIZES.map(s=>opt(s,s||'—',c.size||'')).join('')}</select></label>
    <label class="full">Address<input name="address" value="${esc(c.address)}"></label>
    <label class="check full"><input type="checkbox" name="taxable" ${c.taxable===false?'':'checked'}> Charge Florida sales tax (uncheck if they gave you a resale/exemption certificate)</label>
    <label class="check full"><input type="checkbox" name="recurring" ${c.recurring?'checked':''}> Recurring client</label>
    <div class="full grid2" data-rec>
      <label>How often${freqSelect(c.frequency)}</label>
      <label>Next expected order<input type="date" name="nextOrderDate" value="${esc(c.nextOrderDate||'')}"></label>
      <label>Cases per order<input name="casesPerOrder" type="number" min="0" step="1" inputmode="numeric" value="${c.casesPerOrder??''}"></label>
      <label>Price per case<input name="pricePerCase" type="number" min="0" step="0.01" inputmode="decimal" value="${c.pricePerCase??''}"></label>
    </div>
    <label class="full">Notes<textarea name="notes" rows="2">${esc(c.notes)}</textarea></label></div>`;
  openModal({title:isNew?'Add client':'Edit client',body,
    onOpen:f=>{const r=$('[data-rec]',f);const sw=()=>r.style.opacity=f.recurring.checked?1:.45;f.recurring.addEventListener('change',sw);sw()},
    onSubmit:async f=>{if(!needWrite())return false;const g=n=>f[n].value.trim();
      const data={name:g('name'),businessType:g('businessType'),contact:g('contact'),phone:g('phone'),size:g('size'),address:g('address'),
        taxable:f.taxable.checked,recurring:f.recurring.checked,frequency:g('frequency'),nextOrderDate:validDate(g('nextOrderDate'))?g('nextOrderDate'):'',
        casesPerOrder:num(g('casesPerOrder')),pricePerCase:num(g('pricePerCase')),notes:g('notes')};
      if(!data.name){toast('Add the business name');return false}
      if(!isNew&&lc(data.name)!==lc(c.name)&&findClientByName(data.name)||isNew&&findClientByName(data.name)){toast('A client with that name already exists');return false}
      if(data.recurring&&!c.recurring)data.recurringSince=today();
      if(data.recurring&&!data.nextOrderDate)data.nextOrderDate=nextOrder(today(),data.frequency);
      if(isNew)await S.db.collection('clients').add({...data,repId:S.uid||null,createdAt:iso()});
      else await S.db.doc('clients/'+c.id).update(data);
      toast(isNew?'Client added':'Client updated')}})}

function openEditVisit(v){openModal({title:'Edit visit',body:visitFormHTML(v),onOpen:bindVisitForm,
  onSubmit:async f=>{if(!needWrite())return false;const d=readVisit(f);if(!validVisit(d))return false;

    await S.db.doc('visits/'+v.id).update(d);toast('Visit updated');
    if(toWon)setTimeout(()=>openOrderModal({mode:'won',visit:{...v,...d,id:v.id}}),0)}})}

/* ---------- views ---------- */
const views={};

/* DASHBOARD */
views.dashboard={
  shell:()=>`<div class="pagehead"><div><h1>Sales HQ</h1><p>${new Date().toLocaleDateString(LOC(),{weekday:'long',month:'long',day:'numeric'})}</p></div>
    <a class="btn p" href="#log">+ Log a visit</a></div><div id="dash"></div>`,
  update(){const el=$('#dash');if(!el)return;const c=cfg();const P=periods();const cr=closeRate();
    let h='';
    if(!num(c.monthlyRevenueGoal)&&!pushWindow())h+=`<div class="callout"><span>No sales goal set yet. Set the monthly target so the team can see what to hit.</span><a class="btn p sm" href="#goals">Set goals</a></div>`;
    /* period cards */
    h+='<div class="cards3">';
    for(const p of [P.day,P.week,P.month]){const f=forecast(p);const g=f.goal.rev;const prog=g?Math.min(1,f.booked.revenue/g):0;
      const gap=f.expected-g;
      const chip=!g?'':gap>=0?`<span class="chip ok">On track</span>`:`<span class="chip bad">${money(-gap)} short</span>`;
      h+=`<div class="pcard"><div class="row"><span class="k">${p.label}</span>${chip}</div>
        <div class="big">${money(f.booked.revenue)}</div>
        <div class="sub">booked · ${int(f.booked.cases)} cases · ${f.booked.list.length} order${f.booked.list.length===1?'':'s'}</div>
        <div class="prog ${prog>=1?'g':''}"><i style="width:${(prog*100).toFixed(1)}%"></i></div>
        <div class="row sub"><span>${g?`Goal ${money(g)}${f.goal.cases?` · ${int(Math.ceil(f.goal.cases))} cases`:''}`:pushNote(p)}</span><span>${g?pct(f.booked.revenue/g):''}</span></div>
        <div class="exp"><div class="row"><span class="sub">Expected revenue</span><b>${money(f.expected)}</b></div>
        <div class="sub" style="margin-top:4px">${money(f.booked.revenue)} booked + ${money(f.rec.total)} recurring reorders + ${money(f.weighted)} likely from open quotes</div></div></div>`}
    h+='</div>';
    /* what it takes + pipeline */
    const ST=stockStatus();const sold=S.sales.reduce((t,s)=>t+num(s.cases),0);const inv=ST.total;const remaining=ST.totalLeft;
    const t=today();const daysLeft=validDate(c.sellByDate)?Math.max(0,daysBetween(t,c.sellByDate)):0;const weeksLeft=Math.max(daysLeft/7,1/7);

    const pw=pushWindow();const fromP=pw?(pw.start&&pw.start>t?pw.start:t):t;const wdl=pw?workDays(fromP,pw.end):0;
    const cpw=pw&&wdl?remaining/wdl*wd:inv&&daysLeft?remaining/weeksLeft:goalFor('week').cases;
    let paceRow='';if(pw&&pw.start&&t>pw.start){const tot=workDays(pw.start,pw.end),done=workDays(pw.start,addDays(t,-1));const soldP=stockSoldSince(pw.start);const exp=tot?(pw.ST.totalLeft+soldP)*done/tot:0;const diff=soldP-exp;
      paceRow=`<div class="stat"><span class="l">Sold since ${fmtDate(pw.start)}<small>${int(Math.round(exp))} should be sold by now to finish on time</small></span><span class="v">${int(soldP)} <span class="chip ${diff>=0?'ok':'bad'}">${diff>=0?'On pace':`${int(Math.ceil(-diff))} behind`}</span></span></div>`}
    const dealsW=casesPerDeal?cpw/casesPerDeal:0;const visitsW=cr.rate?dealsW/cr.rate:0;
    const wk=salesIn(P.week.start,P.week.end);const visitsThisWeek=S.visits.filter(v=>inRange(v.date,P.week.start,P.week.end)).length;
    const activeReps=new Set(S.visits.filter(v=>validDate(v.date)&&daysBetween(v.date,t)<=30).map(v=>v.repId).filter(Boolean)).size||1;
    const teamVisitGoalW=num(c.visitsPerRepPerDay)*wd*activeReps;
    h+='<div class="cols"><section class="panel"><h2>What it takes</h2><div class="stats">';
    if(inv)h+=`<div class="stat"><span class="l">Cases left to sell<small>${int(inv)} in stock − ${int(ST.soldAll)} sold</small></span><span class="v hi">${int(remaining)}</span></div>`;
    if(pw)h+=`<div class="stat"><span class="l">Selling window<small>${pw.start?`${fmtDate(pw.start)} – `:'until '}${fmtDateY(pw.end)} · ${int(daysLeft)} days left</small></span><span class="v">${int(wdl)} work days</span></div>`+paceRow+
      `<div class="stat"><span class="l">Cases needed per work day<small>${int(remaining)} cases ÷ ${int(wdl)} work days</small></span><span class="v hi">${wdl?one(Math.ceil(remaining/wdl*10)/10):'—'}</span></div>`;

    h+='</div></section>';

    h+=`<section class="panel"><h2>Pipeline</h2><div class="mini"><div><b>${open.length}</b><span>open quotes</span></div><div><b>${money(openVal)}</b><span>quoted value</span></div><div><b>${pct(cr.rate)}</b><span>close rate</span></div></div>
      <div class="sec-title" style="margin-top:6px">Follow-ups due</div>`;
    h+=due.length?`<div class="tscroll"><table><tbody>${due.slice(0,8).map(v=>`<tr><td><b>${esc(v.place)}</b><div class="sub">${esc(nameOf(v.repId))} · ${money2(v.price)}/case${v.cases?` × ${int(v.cases)}`:''}</div></td>
      <td class="n"><span class="chip ${v.followUpDate<t?'bad':v.followUpDate===t?'warn':''}">${v.followUpDate<t?'Overdue · ':''}${fmtDate(v.followUpDate)}</span></td></tr>`).join('')}</tbody></table></div>`
      :`<div class="empty" style="padding:14px">No follow-ups due in the next 2 days.</div>`;
    h+=`</section></div>`;
    /* stock by size */
    if(ST.sized){h+=`<section class="panel"><div class="ph"><h2>Stock by size</h2><span class="sub">${int(ST.totalLeft)} of ${int(ST.total)} cases left</span></div><div class="mini">${STOCK_SIZES.map(z=>{const st=ST.start[z],l=ST.left[z],p=st?Math.max(0,l)/st:0;
      const chip=l<=0?'<span class="chip bad">Sold out</span>':p<=.15?'<span class="chip warn">Low</span>':'';
      return `<div><div class="row"><span class="k" style="font-size:12px;letter-spacing:.1em;color:var(--mut);font-weight:700">SIZE ${z}</span>${chip}</div><b style="margin-top:4px">${int(Math.max(0,l))}</b><span>of ${int(st)} cases · ${int(ST.sold[z])} sold</span><div class="prog ${p<=.15?'':'g'}" style="margin:8px 0 0"><i style="width:${(p*100).toFixed(1)}%"></i></div></div>`}).join('')}</div>
      ${ST.unassigned?`<p class="sub" style="margin:0">${int(ST.unassigned)} sold cases have no size breakdown. Edit those sales and choose the size, or Mixed with cases per size.</p>`:''}</section>`}
    /* money owed: the owner sees everything, a team member sees only their own sales */
    if(moneyView()){const mine=S.isOwner?S.sales:S.sales.filter(canSeePay);const unpaid=mine.filter(isUnpaid).sort((a,b)=>(a.dueDate||'9')<(b.dueDate||'9')?-1:1);const owedTot=unpaid.reduce((a,s)=>a+owedOf(s),0);
    const allGrand=mine.reduce((a,s)=>a+grandOf(s),0);const allTax=S.isOwner?mine.reduce((a,s)=>a+taxOf(s),0):0;const overdue=unpaid.filter(isOverdue);const myCases=mine.reduce((a,s)=>a+num(s.cases),0);
    h+=`<section class="panel"><div class="ph"><h2>${S.isOwner?'Money owed':'Your money owed'}</h2><a class="btn sm" href="#sales">All sales</a></div>
      ${S.isOwner?'':'<p class="sub" style="margin:-4px 0 12px">Only the sales credited to you. Ask the owner to mark an invoice paid.</p>'}
      <div class="mini"><div><b style="color:${owedTot?'var(--amber)':'inherit'}">${money(owedTot)}</b><span>${unpaid.length} unpaid invoice${unpaid.length===1?'':'s'}${overdue.length?` · ${overdue.length} overdue`:''}</span></div><div><b>${money(allGrand-owedTot)}</b><span>collected to date</span></div><div><b>${money(mine.reduce((a,s)=>a+num(s.total),0))}</b><span>sold to date (before tax) · ${int(S.isOwner?sold:myCases)} cases</span></div></div>
      ${allTax?`<p class="sub" style="margin:-2px 0 12px">Sales tax charged so far: <b>${money2(allTax)}</b>. That money goes to the Florida Department of Revenue, so it is left out of revenue and goals.</p>`:''}`;
    if(unpaid.length){const byClient={};unpaid.forEach(s=>{const k=s.clientId||lc(s.clientName);(byClient[k]=byClient[k]||{name:(S.clients.find(c=>c.id===s.clientId)||{}).name||s.clientName,list:[]}).list.push(s)});
      h+=`<div class="tscroll"><table><thead><tr><th>Client</th><th>Order</th><th class="n">Due</th><th class="n">Owed</th><th></th></tr></thead><tbody>${unpaid.map(s=>`<tr><td><b>${esc((S.clients.find(c=>c.id===s.clientId)||{}).name||s.clientName)}</b></td>
        <td>${int(s.cases)} cases${s.size?` ${esc(s.size)}`:''} @ ${money2(s.pricePerCase)}${taxOf(s)?' + tax':''}${s.invoiceNo?`<div class="sub">#${esc(s.invoiceNo)}</div>`:''}${s.date?`<div class="sub">${fmtDate(s.date)}</div>`:''}</td>
        <td class="n">${validDate(s.dueDate)?`<span class="chip ${isOverdue(s)?'bad':''}">${isOverdue(s)?'Overdue · ':''}${fmtDate(s.dueDate)}</span>`:'<span class="sub">—</span>'}</td>
        <td class="n"><b>${money2(owedOf(s))}</b>${s.paymentStatus==='partial'?'<div class="sub">partly paid</div>':''}</td>
        <td class="n">${S.isOwner&&S.db?`<button class="btn sm g" data-markpaid="${esc(s.id)}">Mark paid</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
      const totals=Object.values(byClient).map(x=>`${esc(x.name)} ${money(x.list.reduce((a,s)=>a+owedOf(s),0))}`);
      if(totals.length>1)h+=`<p class="sub" style="margin:10px 0 0">By client: ${totals.join(' · ')}</p>`}
    else h+=`<div class="empty" style="padding:14px">Nothing owed. Every invoice is paid.</div>`;
    h+='</section>'}
    /* recurring */
    const rec=S.clients.filter(x=>x.recurring);const mrr=rec.reduce((a,x)=>a+clientMRR(x),0);
    const newRec=rec.filter(x=>inRange(x.recurringSince,P.month.start,P.month.end));
    const repeat=S.clients.filter(x=>!x.recurring&&clientOrders(x).length>=2);
    h+=`<section class="panel"><div class="ph"><h2>Recurring clients</h2><a class="btn sm" href="#clients">All clients</a></div>
      <div class="mini"><div><b>${rec.length}</b><span>recurring clients</span></div><div><b>${money(mrr)}</b><span>expected per month</span></div><div><b>${newRec.length}</b><span>new this month</span></div></div>`;
    if(rec.length){const rows=[...rec].sort((a,b)=>(a.nextOrderDate||'9')<(b.nextOrderDate||'9')?-1:1);
      h+=`<div class="tscroll"><table><thead><tr><th>Client</th><th>Schedule</th><th class="n">Per month</th><th class="n">Next order</th></tr></thead><tbody>${rows.map(x=>{
        const nd=x.nextOrderDate;const st=!validDate(nd)?'':nd<t?'bad':daysBetween(t,nd)<=7?'warn':'';
        return `<tr><td><b>${esc(x.name)}</b>${inRange(x.recurringSince,P.month.start,P.month.end)?' <span class="chip pink">New</span>':''}<div class="sub">${esc(x.businessType||'')}${x.recurringSince?` · since ${fmtDate(x.recurringSince)}`:''}</div></td>
        <td>${esc((FREQ[x.frequency]||{}).label||'—')}<div class="sub">${int(x.casesPerOrder)} cases @ ${money2(x.pricePerCase)}</div></td>
        <td class="n">${money(clientMRR(x))}</td><td class="n"><span class="chip ${st}">${nd&&nd<t?'Overdue · ':''}${fmtDate(nd)}</span></td></tr>`}).join('')}</tbody></table></div>`}
    else h+=`<div class="empty">No recurring clients yet. When you mark a visit as won, tick “Recurring client”.</div>`;
    if(repeat.length)h+=`<p class="sub" style="margin:12px 0 0">Bought 2+ times but not marked recurring: <b>${repeat.map(x=>esc(x.name)).join(', ')}</b>. Mark them recurring in Clients so their reorders count in the forecast.</p>`;
    h+='</section>';
    /* team */
    const reps=new Set();const mVisits=S.visits.filter(v=>inRange(v.date,P.month.start,P.month.end));const mSales=salesIn(P.month.start,P.month.end).list;
    mVisits.forEach(v=>v.repId&&reps.add(v.repId));mSales.forEach(s=>s.repId&&reps.add(s.repId));
    const visitGoalWk=num(c.visitsPerRepPerDay)*wd;
    const rows=[...reps].map(id=>({id,vw:S.visits.filter(v=>v.repId===id&&inRange(v.date,P.week.start,P.week.end)).length,vm:mVisits.filter(v=>v.repId===id).length,
      open:S.visits.filter(v=>v.repId===id&&isOpen(v)).length,won:mVisits.filter(v=>v.repId===id&&v.status==='won').length,
      rev:mSales.filter(s=>s.repId===id).reduce((a,s)=>a+num(s.total),0),cases:mSales.filter(s=>s.repId===id).reduce((a,s)=>a+num(s.cases),0)})).sort((a,b)=>b.rev-a.rev||b.vm-a.vm);
    h+=`<section class="panel"><h2>Team this month</h2>`;
    h+=rows.length?`<div class="tscroll"><table><thead><tr><th>Rep</th><th class="n">Visits this week</th><th class="n">Visits (month)</th><th class="n">Open quotes</th><th class="n">Won</th><th class="n">Cases</th><th class="n">Revenue</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><b>${esc(nameOf(r.id))}</b></td><td class="n">${r.vw}${visitGoalWk?` <span class="sub">/ ${int(visitGoalWk)}</span>`:''}</td><td class="n">${r.vm}</td><td class="n">${r.open}</td><td class="n">${r.won}</td><td class="n">${int(r.cases)}</td><td class="n"><b>${money(r.rev)}</b></td></tr>`).join('')}</tbody></table></div>`
      :`<div class="empty">No visits logged this month yet.</div>`;
    h+='</section>';
    el.innerHTML=h}};

/* LOG VISIT */
views.log={
  shell:()=>`<div class="pagehead"><div><h1>Log a visit</h1><p>Where you went, what you quoted, and how it went.</p></div></div>

  bind(m){const f=$('#logForm',m);bindVisitForm(f);

      try{const ref=await S.db.collection('visits').add({...v,repId:S.uid||null,createdAt:iso()});

        if(wantWon)openOrderModal({mode:'won',visit:{...v,id:ref.id,repId:S.uid||null}})}

/* VISITS */
function visitCard(v){const t=today();return `<div class="item" data-id="${esc(v.id)}"><div class="top"><div><h3>${esc(v.place)}</h3>
  <div class="meta">${esc(v.businessType||'')} · ${fmtDate(v.date)} · ${esc(nameOf(v.repId))}${v.address?` · ${esc(v.address)}`:''}</div>
  ${v.contact||v.phone?`<div class="meta">${esc(v.contact||'')}${v.contact&&v.phone?' · ':''}${esc(v.phone||'')}</div>`:''}</div>
  <div><div class="money">${money2(v.price)}<span class="sub">/case</span></div><div class="sub" style="text-align:right">${v.cases?`${int(v.cases)} cases · ${money(visitValue(v))}`:''}${v.size?` · ${esc(v.size)}`:''}</div></div></div>
  ${v.notes?`<div class="notes">${esc(v.notes)}</div>`:''}
  <div class="acts"><span class="chip ${STATUS_CHIP[v.status]||''}">${STATUS[v.status]||'Quoted'}</span>
  ${isOpen(v)&&validDate(v.followUpDate)?`<span class="chip ${v.followUpDate<t?'bad':''}">Follow up ${fmtDate(v.followUpDate)}</span>`:''}
  ${num(cfg().floorPrice)&&num(v.price)<num(cfg().floorPrice)?`<span class="chip warn">Below floor</span>`:''}
  <span style="flex:1"></span>
  ${S.canWrite&&S.db?`${v.status!=='won'?`<button class="btn sm g" data-act="won">Mark won</button>`:''}
  ${isOpen(v)?`<select class="sel-inline" data-act="status">${['quoted','followup','lost'].map(k=>opt(k,STATUS[k],v.status)).join('')}</select>`:''}
  <button class="btn sm" data-act="edit">Edit</button><button class="btn sm d" data-act="del">Delete</button>`:''}</div></div>`}
function bindCards(root){root.querySelectorAll('.item[data-id]').forEach(card=>{const v=S.visits.find(x=>x.id===card.dataset.id);if(!v)return;
  card.querySelectorAll('[data-act]').forEach(b=>{const a=b.dataset.act;
    if(a==='status')b.onchange=async()=>{if(!needWrite())return;try{await S.db.doc('visits/'+v.id).update({status:b.value});if(v.leadId)await S.db.doc('leads/'+v.leadId).update({status:visitStatusToLead(b.value)}).catch(()=>{});toast('Updated')}catch(e){writeErr(e)}};
    else b.onclick=()=>{if(a==='won')openOrderModal({mode:'won',visit:v});if(a==='edit')openEditVisit(v);if(a==='del')confirmDelete('visit to '+v.place,S.db.doc('visits/'+v.id))}})})}
views.visits={
  shell:()=>`<div class="pagehead"><div><h1>Visits</h1><p>Every place the team visited and the price quoted.</p></div><a class="btn p" href="#log">+ Log a visit</a></div>
    <div class="filters"><input type="search" id="vq" placeholder="Search place, area, notes…">
    <select id="vs"><option value="">All results</option><option value="open">Open (quoted + follow-up)</option>${Object.entries(STATUS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
    <select id="vr"><option value="all">All time</option><option value="day">Today</option><option value="week">This week</option><option value="month" selected>This month</option></select>

    list.sort((a,b)=>(b.date||'')===(a.date||'')?((b.createdAt||'')>(a.createdAt||'')?1:-1):((b.date||'')>(a.date||'')?1:-1));

    el.innerHTML=list.length?`<div class="list">${list.slice(0,300).map(visitCard).join('')}</div>`:`<div class="empty">No visits match. ${S.visits.length?'Try “All time”.':'Log the first one!'}</div>`;bindCards(el)}};

views.clients={
  shell:()=>`<div class="pagehead"><div><h1>Clients</h1><p>Who's buying, and who reorders on a schedule.</p></div>${S.canWrite&&S.db?`<button class="btn p" id="addClient">+ Add client</button>`:''}</div>
    <div class="filters"><input type="search" id="cq" placeholder="Search clients…"><select id="cf"><option value="">All clients</option><option value="rec">Recurring</option>${moneyView()?'<option value="owes">Owes money</option>':''}<option value="repeat">Bought 2+ times</option><option value="new">Recurring since this month</option></select></div>
    <div id="clist"></div>`,
  bind(m){const b=$('#addClient',m);b&&(b.onclick=()=>openClientModal());['#cq','#cf'].forEach(s=>$(s,m).addEventListener('input',()=>this.update()))},
  update(){const el=$('#clist');if(!el)return;const q=lc($('#cq').value),f=$('#cf').value,P=periods(),t=today();
    let list=S.clients.map(c=>{const o=clientOrders(c);return{c,o,spent:o.reduce((a,s)=>a+num(s.total),0),owed:moneyView()?o.reduce((a,s)=>a+owedOf(s),0):0,last:o.reduce((a,s)=>(s.date||'')>a?s.date:a,'')}})
      .filter(x=>(!q||lc([x.c.name,x.c.contact,x.c.address,x.c.businessType].join(' ')).includes(q))&&(!f||(f==='rec'&&x.c.recurring)||(f==='owes'&&x.owed>0)||(f==='repeat'&&x.o.length>=2)||(f==='new'&&x.c.recurring&&inRange(x.c.recurringSince,P.month.start,P.month.end))));

      <h3>${esc(c.name)} ${c.recurring?'<span class="chip ok">Recurring</span>':''}${!c.recurring&&o.length>=2?' <span class="chip pink">Repeat buyer</span>':''}</h3>
      <div class="meta">${esc(c.businessType||'')}${c.contact?` · ${esc(c.contact)}`:''}${c.phone?` · ${esc(c.phone)}`:''}${c.address?` · ${esc(c.address)}`:''}</div>
      ${c.recurring?`<div class="meta">${esc((FREQ[c.frequency]||{}).label||'')} · ${int(c.casesPerOrder)} cases @ ${money2(c.pricePerCase)} · ${money(clientMRR(c))}/month${c.recurringSince?` · since ${fmtDateY(c.recurringSince)}`:''}</div>`:''}</div>
      <div><div class="money">${money(spent)}</div><div class="sub" style="text-align:right">${o.length} order${o.length===1?'':'s'}${last?` · last ${fmtDate(last)}`:''}</div>${owed?`<div style="text-align:right;margin-top:4px"><span class="chip warn">Owes ${money2(owed)}</span></div>`:''}</div></div>
      ${c.notes?`<div class="notes">${esc(c.notes)}</div>`:''}
      <div class="acts">${c.recurring&&validDate(nd)?`<span class="chip ${nd<t?'bad':daysBetween(t,nd)<=7?'warn':''}">Next order ${nd<t?'overdue · ':''}${fmtDate(nd)}</span>`:''}<span style="flex:1"></span>
      ${S.canWrite&&S.db?`<button class="btn sm g" data-act="order">Log order</button><button class="btn sm" data-act="edit">Edit</button><button class="btn sm d" data-act="del">Delete</button>`:''}</div></div>`}).join('')}</div>`
      :`<div class="empty">${S.clients.length?'No clients match.':'No clients yet. They appear here when a visit is marked won, or add one directly.'}</div>`;
    el.querySelectorAll('[data-cid]').forEach(card=>{const c=S.clients.find(x=>x.id===card.dataset.cid);if(!c)return;card.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
      if(b.dataset.act==='order')openOrderModal({mode:'client',client:c});if(b.dataset.act==='edit')openClientModal(c);if(b.dataset.act==='del')confirmDelete('client '+c.name,S.db.doc('clients/'+c.id))})})}};

views.sales={
  shell:()=>`<div class="pagehead"><div><h1>Sales</h1><p>${S.isOwner?'Every order and invoice, paid or not.':moneyView()?'Every order and invoice. Payment status shows on your own sales only.':'Every order and invoice.'}</p></div>${S.canWrite&&S.db?`<button class="btn p" id="addSale">+ Add sale</button>`:''}</div>
    <div class="filters"><select id="sr"><option value="day">Today</option><option value="week">This week</option><option value="month">This month</option><option value="all" selected>All time</option></select>${moneyView()?'<select id="sp"><option value="">Paid &amp; unpaid</option><option value="unpaid">Not paid</option><option value="paid">Paid</option></select>':'<input type="hidden" id="sp" value="">'}</div>

    const list=S.sales.filter(s=>(r==='all'||inRange(s.date,P[r].start,P[r].end))&&(!pf||(pf==='unpaid'?isUnpaid(s):canSeePay(s)&&!isUnpaid(s)))).sort((a,b)=>(b.date||'')===(a.date||'')?((b.createdAt||'')>(a.createdAt||'')?1:-1):((b.date||'')>(a.date||'')?1:-1));

    el.innerHTML=list.length?`<div class="panel" style="padding:6px 12px"><div class="tscroll"><table><thead><tr><th>Date</th><th>Client</th><th>Rep</th><th class="n">Cases</th><th class="n">Price</th><th class="n">Total</th>${moneyView()?'<th>Payment</th>':''}<th></th></tr></thead><tbody>
      ${list.slice(0,500).map(s=>{const c=s.clientId&&S.clients.find(x=>x.id===s.clientId);return `<tr><td class="nowrap">${s.date?fmtDate(s.date):'<span class="sub">No date</span>'}</td><td><b>${esc(c?c.name:s.clientName)}</b>${c&&c.recurring?' <span class="chip ok">★</span>':''}<div class="sub">${s.size?`Size ${esc(s.size)}`:''}${s.invoiceNo?`${s.size?' · ':''}#${esc(s.invoiceNo)}`:''}${s.notes?`${s.size||s.invoiceNo?' · ':''}${esc(s.notes)}`:''}</div></td>

/* ---------- price tiers ---------- */
const TIER_MINS=[1,10,20,50];
const TIER_LABELS=['1–9 cases','10–19 cases','20–49 cases','50+ cases'];
function tierPrices(){const c=cfg();return [1,2,3,4].map(i=>num(c['tierPrice'+i]))}
function tierPrice(cases){const p=tierPrices();if(!p.some(x=>x>0))return 0;const n=Math.max(1,num(cases)||1);let r=0;TIER_MINS.forEach((m,i)=>{if(n>=m&&p[i]>0)r=p[i]});return r||p.find(x=>x>0)||0}
function tierLabel(cases){const n=Math.max(1,num(cases)||1);let k=0;TIER_MINS.forEach((m,i)=>{if(n>=m)k=i});return TIER_LABELS[k]}
/* auto-fill price from tiers until the user types a price */
function bindTierPrice(f){let manual=f.price.value!=='';
  const set=()=>{if(manual)return;const p=tierPrice(f.cases.value);if(p){f.price.value=p.toFixed(2);f.price.dispatchEvent(new Event('input'))}};
  f.price.addEventListener('input',e=>{if(e.isTrusted)manual=f.price.value!==''});f.cases.addEventListener('input',set);set()}
function tierHintHTML(){const p=tierPrices();if(!p.some(x=>x>0))return '';
  return `<div class="full tiers">${p.map((x,i)=>x?`<span><b>${money2(x)}</b> ${TIER_LABELS[i]}</span>`:'').join('')}</div>`}

/* ---------- leads ---------- */
const LEAD_STATUS={new:'Not visited',called:'Called',visited:'Visited',quoted:'Quoted',won:'Client',no:'Not interested'};
const LEAD_CHIP={new:'',called:'pink',visited:'pink',quoted:'warn',won:'ok',no:'bad'};
const telHref=p=>{const d=String(p||'').replace(/[^\d+]/g,'');return d?'tel:'+d:''};
const mapsHref=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'');
const zipOf=a=>{const m=String(a||'').match(/\b(\d{5})\b(?!.*\b\d{5}\b)/);return m?m[1]:'99999'};
const estMax=l=>{const m=String(l.estCases||'').match(/(\d+)\D*$/);return m?+m[1]:0};
const leadDue=l=>validDate(l.followUpDate)&&l.followUpDate<=today()&&l.status!=='won'&&l.status!=='no';
/* how easy a type of business is to close on exam gloves: 0 = easiest (dentists use gloves on every patient and the owner decides on the spot) */
const LEAD_EASE=[[/dental/i,0],[/urgent|podiat|dermat|plastic|tattoo|med spa/i,1],[/clinic|medical lab|assisted|nursing/i,2],[/nail|lash|brow|wax|spa|skin|barber|veterin/i,3],[/salon|home health|funeral|pet|pharmac|daycare|gym/i,4],[/food truck|physical|rehab|cater|bakery|cafe|butcher|seafood|sushi/i,5]];
function leadEase(l){const t=(l.type||'')+' '+(l.group||'');for(const [re,v] of LEAD_EASE)if(re.test(t))return v;return 6}
/* closest and easiest first: miles from the warehouse plus 1.5 miles per step of difficulty */
const leadRank=l=>(typeof l.miles==='number'?l.miles:12)+leadEase(l)*1.5;
function leadScore(l){if(leadDue(l))return 0;if(l.status==='quoted'||l.status==='visited'||l.status==='called')return 1;if(l.status==='new')return l.buyerType==='Reseller'?4:2;return 9}
function leadsSorted(list){return [...list].sort((a,b)=>{const d=leadScore(a)-leadScore(b);if(d)return d;const fa=a.followUpDate||'9',fb=b.followUpDate||'9';if(fa!==fb)return fa<fb?-1:1;const ra=leadRank(a),rb=leadRank(b);if(ra!==rb)return ra-rb;return zipOf(a.address).localeCompare(zipOf(b.address))||lc(a.name).localeCompare(lc(b.name))})}
function visitStatusToLead(st){return st==='won'?'won':st==='lost'?'no':'quoted'}

/* today's route: one per person, starts fresh every day */
function routeIds(){return S.routeDoc&&S.routeDoc.date===today()&&Array.isArray(S.routeDoc.leadIds)?S.routeDoc.leadIds:[]}
async function saveRoute(ids){S.routeDoc={date:today(),leadIds:ids};refresh();
  if(S.db&&S.uid){try{await S.db.doc('data/users/'+S.uid+'/route').set(S.routeDoc)}catch(e){}}
  else{try{localStorage.setItem('ucker-route',JSON.stringify(S.routeDoc))}catch(e){}}}
function toggleRoute(id){const ids=routeIds();saveRoute(ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);toast(ids.includes(id)?'Removed from today\'s route':'Added to today\'s route')}
function routeStops(){const ids=routeIds();return ids.map(id=>S.leads.find(l=>l.id===id)).filter(Boolean).sort((a,b)=>zipOf(a.address).localeCompare(zipOf(b.address))||lc(a.address).localeCompare(lc(b.address)))}
function routeLinks(stops){const out=[];for(let i=0;i<stops.length;i+=10){const leg=stops.slice(i,i+10);const dest=leg[leg.length-1];const wps=leg.slice(0,-1).map(s=>s.address);
  out.push({label:stops.length>10?`Stops ${i+1}–${i+leg.length}`:'Open route in Google Maps',href:'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(dest.address)+(wps.length?'&waypoints='+encodeURIComponent(wps.join('|')):'')})}return out}
function openRouteModal(){const stops=routeStops();
  const body=stops.length?`<ol class="route">${stops.map(l=>`<li><div><b>${esc(l.name)}</b><div class="sub">${esc(l.address)}</div></div><button type="button" class="btn sm" data-rmroute="${esc(l.id)}">Remove</button></li>`).join('')}</ol>
    <div class="btnrow">${routeLinks(stops).map(x=>`<a class="btn p" href="${esc(x.href)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join('')}</div>
    <p class="sub" style="margin:12px 0 0">Stops are grouped by ZIP code. Google Maps starts from where you are; tap its menu to reorder stops if needed.</p>`
    :`<p class="muted" style="margin:0">No stops yet. On the Leads page, tap “+ Route” on the businesses you want to visit today.</p>`;
  openModal({title:'Today\'s route',sub:stops.length?`${stops.length} stop${stops.length===1?'':'s'}`:'',body,submit:'Done',onSubmit:async()=>true,
    onOpen:f=>{f.querySelectorAll('[data-rmroute]').forEach(b=>b.onclick=()=>{toggleRoute(b.dataset.rmroute);closeModal();setTimeout(openRouteModal,0)})}})}

function leadCard(l){const inRoute=routeIds().includes(l.id);const tel=telHref(l.phone);const t=today();

function typeForLead(t){const map={'Barber':'Barbershop','Salon / Nails':'Nail / lash salon','Lash & brow studio':'Nail / lash salon','Tattoo':'Tattoo studio','Restaurant':'Restaurant / food truck','Food truck':'Restaurant / food truck','Cleaning company':'Cleaning service','Dental / Medical':'Medical / dental','Medical clinic / Urgent care':'Medical / dental','Auto / Body shop':'Auto shop'};return map[t]||t||'Other'}

const SEEDS=[];let seedCache=null;
async function loadSeeds(){if(seedCache)return seedCache;const all=[];for(const f of SEEDS){try{const r=await fetch(f);if(r.ok)all.push(...await r.json())}catch(e){}}seedCache=all;return all}
async function importLeads(btn){if(!S.db||!S.isOwner)return;btn.disabled=true;const list=await loadSeeds();if(!list.length){toast('Couldn\'t load the call list file.');btn.disabled=false;return}
  const have=new Set(S.leads.map(l=>l.id));const todo=list.filter(l=>!have.has(l.id));let n=0,stop=false;
  const worker=async()=>{while(todo.length&&!stop){const l=todo.shift();const {id,...data}=l;
    try{await S.db.doc('leads/'+id).set({...data,createdAt:iso()});n++;btn.textContent=`Importing… ${n} / ${n+todo.length}`}
    catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')){todo.push(l);await new Promise(r=>setTimeout(r,1500))}else{stop=true;writeErr(e)}}}};
  await Promise.all([worker(),worker(),worker(),worker()]);toast(`${n} leads imported`);btn.disabled=false;S.pendingSeeds=todo.length;refresh()}
async function checkPendingSeeds(){if(!S.isOwner||!S.db||S._seedChecked)return;S._seedChecked=true;const list=await loadSeeds();const have=new Set(S.leads.map(l=>l.id));S.pendingSeeds=list.filter(l=>!have.has(l.id)).length;refresh()}

function parseShopify(r){const blocks=[];if(r&&r.payload!==undefined)blocks.push(typeof r.payload==='string'?r.payload:JSON.stringify(r.payload));
  (r&&r.content||[]).forEach(b=>{if(b&&b.type==='text')blocks.push(b.text)});
  for(const t of blocks){const i=t.indexOf('{"data"');if(i>=0){try{return JSON.parse(t.slice(i))}catch(e){}}}return null}
function balanceOf(s){return r2(Math.max(0,grandOf(s)-(s.paymentStatus==='paid'?grandOf(s):num(s.amountPaid))))}
async function createPayLink(s,no){const mcp=await window.claude.use('mcp').catch(()=>null);if(!mcp)throw{code:'no_mcp'};
  const bal=balanceOf(s);if(!(bal>0))throw{code:'nothing_due'};
  const q='mutation($input: DraftOrderInput!) { draftOrderCreate(input: $input) { draftOrder { id invoiceUrl } userErrors { field message } } }';
  const input={lineItems:[{title:`UCKER invoice ${no}: ${int(s.cases)} cases black nitrile exam gloves${taxOf(s)?` (incl. ${one(s.taxRate)}% FL sales tax)`:''}`,quantity:1,
    originalUnitPriceWithCurrency:{amount:bal.toFixed(2),currencyCode:'USD'},requiresShipping:false,taxable:false}],taxExempt:true,
    note:`UCKER Sales HQ invoice ${no} for ${s.clientName||''}`,poNumber:no,tags:['ucker-invoice',no]};
  const r=await mcp.callTool('Shopify','graphql_mutation',{query:q,variables:{input}});const j=parseShopify(r);
  const d=j&&j.data&&j.data.draftOrderCreate;if(!d||!d.draftOrder||(d.userErrors&&d.userErrors.length))throw{code:'shopify',message:d&&d.userErrors&&d.userErrors[0]&&d.userErrors[0].message||'Shopify did not return a link'};
  await S.db.doc('sales/'+s.id).update({payLinkUrl:d.draftOrder.invoiceUrl,payLinkId:d.draftOrder.id,payLinkAmount:bal});return d.draftOrder.invoiceUrl}

  const timer=setTimeout(()=>{if(!allReady()&&S.status==='loading'){S.status='slow';renderBanner()}},10000);
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  if(!db){clearTimeout(timer);S.status='nodb';renderBanner();route();return}
  S.db=db;S.user=user;
  if(user){try{S.uid=await user.id()}catch(e){}try{S.isOwner=!!(await user.isOwner())}catch(e){}try{S.canEdit=!!(await user.canEdit())}catch(e){}
    try{const w=await user.can('data.write');if(w===false)S.canWrite=false}catch(e){}}
  renderBanner();route();
  const after=()=>{if(allReady()){clearTimeout(timer);if(S.status==='loading'||S.status==='slow')S.status='ok';setTimeout(checkShopifyPayments,1500);scheduleRepSync()}renderBanner();refresh();loadNames()};
  const onErr=k=>e=>{S.ready[k]=true;clearTimeout(timer);S.status=e&&e.code==='revoked'?'revoked':'error';renderBanner();refresh()};
  for(const k of ['visits','clients','sales'])db.collection(k).onSnapshot(s=>{const docs=s.docs.map(d=>({...d.data(),id:d.id}));if(k==='sales'){S.salesRaw=docs;mergeSales()}else S[k]=docs;if(!s.metadata.fromCache)S.ready[k]=true;after()},onErr(k));
  db.collection('leads').onSnapshot(s=>{S.leads=s.docs.map(d=>({...d.data(),id:d.id}));refresh()},()=>{});

  else{try{S.routeDoc=JSON.parse(localStorage.getItem('ucker-route')||'null')}catch(e){}}
  db.doc('config/goals').onSnapshot(s=>{S.config=s.exists?s.data():null;if(!s.metadata.fromCache)S.ready.config=true;after()},onErr('config'));
  if(S.isOwner)db.collection('ownerOnly/ledger/payments').onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();m[d.id]={};PAY_KEYS.forEach(k=>{if(x[k]!==undefined)m[d.id][k]=x[k]})});S.payments=m;mergeSales();refresh()},()=>{});
  if(!S.isOwner&&S.uid)db.collection('repPay/'+S.uid+'/sales').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});S.myPay=m;mergeSales();refresh()},()=>{});
  if(S.isOwner)db.doc('ownerOnly/costs').onSnapshot(s=>{S.costs=s.exists?s.data():null;refresh()},()=>{});
}
init();
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
